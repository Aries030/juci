<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>剧词</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#181818; --ink-2:#6A6A6A; --line:#E8E8E8; --fill:#F4F4F4; --fill-2:#ECECEC; --bg:#FFFFFF;
  --accent:#0066CC; --accent-ink:#FFFFFF; --accent-soft:#E8F1FB;
  --r-s:8px; --r-m:12px; --r-l:20px; --r-xl:28px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--ink);background:var(--bg);font-size:16px;line-height:1.5;font-weight:400;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.icon{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon svg{width:24px;height:24px;display:block}
.icon-sm svg{transform:scale(.75)}

/* header */
header{position:sticky;top:0;z-index:20;background:var(--bg);height:72px;display:flex;align-items:center;
  justify-content:space-between;padding:0 32px}
.show-trigger{display:flex;align-items:center;gap:4px;height:40px;white-space:nowrap;min-width:0;padding:0 12px 0 16px;border-radius:var(--r-m);
  font-size:18px;font-weight:600;letter-spacing:-.01em}
.show-trigger:hover,.show-trigger[aria-expanded="true"]{background:var(--fill)}
.show-trigger .icon{color:var(--ink-2);transition:transform .2s var(--ease)}
.show-trigger[aria-expanded="true"] .icon{transform:rotate(180deg)}
.tools{display:flex;align-items:center;gap:4px}
.icon-btn{width:40px;height:40px;border-radius:var(--r-m);display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);
  transition:background .15s,color .15s,opacity .2s}
.icon-btn:hover{background:var(--fill);color:var(--ink)}
.icon-btn[aria-pressed="true"]{color:var(--accent)}
.intent{opacity:0;pointer-events:none}
header:hover .intent,header:focus-within .intent,.intent[aria-expanded="true"]{opacity:1;pointer-events:auto}
@media (hover:none){.intent{opacity:1;pointer-events:auto}}

/* progress line */
.progress{height:2px;background:var(--fill);margin:0 32px}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s var(--ease)}

/* menus */
.menu{position:fixed;z-index:40;min-width:208px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-l);
  padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.06);opacity:0;transform:translateY(-4px);pointer-events:none;visibility:hidden;
  transition:opacity .14s var(--ease),transform .14s var(--ease),visibility 0s linear .14s}
.menu.open{opacity:1;transform:none;pointer-events:auto;visibility:visible;transition-delay:0s}
.mi{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;height:40px;padding:0 12px;
  border-radius:var(--r-m);font-size:14px;font-weight:500;text-align:left;white-space:nowrap}
.mi:hover,.mi.active,.mi:focus-visible{background:var(--fill);outline:none}
.mi .meta{color:var(--ink-2);font-weight:400;font-variant-numeric:tabular-nums}
.mi .icon{color:var(--ink-2)}
.mi[aria-checked="true"] .icon{color:var(--accent)}
.mi.current{color:var(--accent)}
.mi.danger{position:relative;overflow:hidden;margin-top:8px}
.mi.danger .fill{position:absolute;inset:0;background:#E2E2E2;transform-origin:left;transform:scaleX(0);border-radius:var(--r-m)}
.mi.danger span{position:relative}
.mi.danger.holding .fill{transform:scaleX(1);transition:transform 1.2s linear}

/* stage */
main{max-width:672px;margin:0 auto;padding:72px 32px 160px}
.view[hidden]{display:none}
#studyView{transition:opacity .18s var(--ease),transform .18s var(--ease)}
#studyView.leaving{opacity:0;transform:translateY(-8px)}
#studyView.entering{opacity:0;transform:translateY(8px);transition:none}
.card{outline:none;cursor:pointer;user-select:none;transition:opacity .18s var(--ease),transform .18s var(--ease)}
.card.leaving{opacity:0;transform:translateY(-8px)}
.card.entering{opacity:0;transform:translateY(8px)}
.headword{display:flex;align-items:center;gap:8px;min-height:56px}
.word{font-size:44px;line-height:1.15;font-weight:600;letter-spacing:-.02em}
.say{opacity:0;transition:opacity .15s}
.headword:hover .say,.card:focus-within .say,.say:focus-visible{opacity:1}
@media (hover:none){.say{opacity:1}}
.phon{margin-top:12px;color:var(--ink-2);font-size:16px}
.phon b{font-weight:500;color:var(--ink-2);margin-right:12px}
.quote{margin-top:48px;font-size:16px;line-height:1.75;font-weight:400;color:var(--ink);max-width:36em}
.quote mark{background:none;color:var(--accent);font-weight:600}
.trans{margin-top:8px;color:var(--ink-2);font-size:14px;line-height:1.7;max-width:36em;transition:opacity .2s var(--ease),filter .2s var(--ease)}
.card:not(.revealed):not(.spell) .trans{opacity:0;filter:blur(8px)}
.row-detail .trans{margin-top:4px}
.scene{margin-top:16px;color:var(--ink-2);font-size:14px}
.meaning{margin-top:40px;min-height:36px;font-size:18px;font-weight:600;transition:opacity .2s var(--ease),filter .2s var(--ease)}
.card:not(.revealed) .meaning{opacity:0;filter:blur(8px)}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:56px}
.btn{height:56px;border-radius:var(--r-l);font-size:16px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:12px;
  transition:background .15s,transform .08s}
.btn:active{transform:scale(.98)}
.btn-quiet{background:var(--fill)}
.btn-quiet:hover{background:var(--fill-2)}
.btn-main{background:var(--accent);color:var(--accent-ink)}
.btn-main:hover{background:#0058B0}
.btn-wide{grid-column:1 / -1}
kbd{font:500 12px/1 "Geist",sans-serif;min-width:24px;height:24px;padding:0 8px;border-radius:var(--r-s);display:inline-flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.06);color:var(--ink-2)}
.btn-main kbd{background:rgba(255,255,255,.18);color:#fff}
@media (hover:none){kbd{display:none}}

/* spelling */
.spell{cursor:default}
.prompt{display:flex;align-items:center;gap:8px;min-height:40px;font-size:18px;font-weight:600;line-height:1.4}
.prompt b{font-size:14px;font-weight:500;color:var(--ink-2);margin-right:8px}
.prompt:hover .say,.spell:focus-within .say{opacity:1}
.spell .quote{margin-top:24px}
.nw{white-space:nowrap}
.blank{display:inline-block;width:64px;height:1em;border-bottom:2px solid var(--ink);vertical-align:-4px;margin:0 4px}
.slots{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:12px 16px;margin-top:32px;min-height:48px}
.sw{display:flex;gap:4px;white-space:nowrap}
.slot{flex:none;width:var(--sw);height:48px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;border-bottom:2px solid #D4D4D4;
  font-size:var(--sf);font-weight:600;line-height:1;transition:border-color .15s,color .15s}
.slot.filled{border-color:var(--ink)}
.slot.next{border-color:var(--accent)}
.slot.hinted,.slot.given{color:var(--ink-2)}
.slot.bad{color:var(--ink-2);text-decoration:line-through;border-color:var(--ink-2)}
.slots.ok .slot{color:var(--accent);border-color:var(--accent)}
.wheel{position:relative;margin:40px auto 0;touch-action:none;user-select:none;-webkit-user-select:none}
.wheel svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.wheel polyline{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:.32}
.tile{position:absolute;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-size:var(--tf);font-weight:600;line-height:1;transition:background .12s,color .12s,transform .12s}
.tile:hover{background:var(--fill-2)}
.tile.on{background:var(--accent);color:#fff}
.wheel{transition:opacity .2s var(--ease)}
.wheel.idle{opacity:.4;pointer-events:none}
.wheel .center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.wheel .center[hidden]{display:none}
.spell + .wheel + .actions{margin-top:40px}
.shake{animation:shake .4s var(--ease)}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.wheel.shake{animation:nudge .3s var(--ease)}
@keyframes nudge{30%{transform:translateX(-4px)}70%{transform:translateX(4px)}}

/* done */
.done h2{font-size:18px;font-weight:600}
.done .big{font-size:44px;font-weight:600;letter-spacing:-.02em;margin-top:24px;font-variant-numeric:tabular-nums}
.done .big .unit{font-size:18px;font-weight:500;color:var(--ink-2);margin-left:8px;letter-spacing:0}
.done .stats{margin-top:12px;color:var(--ink-2);font-size:14px;display:flex;gap:24px}
.done .actions{grid-template-columns:1fr}

/* list */
.list-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
.list-head h2{font-size:18px;font-weight:600}
.seg{display:flex;gap:4px;background:var(--fill);padding:4px;border-radius:var(--r-m)}
.seg button{height:32px;padding:0 12px;border-radius:var(--r-s);font-size:14px;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);font-weight:500}
.rows{list-style:none}
.row{border-radius:var(--r-m);margin:0 -16px}
.row-line{display:flex;align-items:center;gap:4px;border-radius:var(--r-m);padding-right:8px}
.row-line:hover{background:var(--fill)}
.row-main{display:flex;align-items:center;gap:16px;flex:1;min-width:0;min-height:56px;padding:8px 16px;text-align:left;border-radius:var(--r-m)}
.row .w{font-weight:500;min-width:9em}
.row .m{color:var(--ink-2);font-size:14px;flex:1}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:#D4D4D4}
.dot.learning{background:none;box-shadow:inset 0 0 0 2px var(--accent)}
.dot.known{background:var(--accent)}
.row .say{opacity:0}
.row:hover .say,.row:focus-within .say{opacity:1}
@media (hover:none){.row .say{opacity:1}}
.row-detail{padding:0 16px 16px 40px;color:var(--ink);font-size:14px;line-height:1.7}
.row-detail mark{background:none;color:var(--accent);font-weight:600}
.row-detail .scene{margin-top:4px}
.empty{color:var(--ink-2);font-size:14px;padding:24px 0}

/* toast */
.toast{position:fixed;left:50%;bottom:32px;z-index:50;transform:translate(-50%,16px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:16px;height:48px;padding:0 8px 0 20px;border-radius:var(--r-xl);background:var(--ink);color:#fff;font-size:14px;
  visibility:hidden;transition:opacity .18s var(--ease),transform .18s var(--ease),visibility 0s linear .18s}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto;visibility:visible;transition-delay:0s}
.toast button{height:32px;padding:0 12px;border-radius:var(--r-l);display:flex;align-items:center;gap:8px;color:#fff;font-weight:500}
.toast button:hover{background:rgba(255,255,255,.12)}
.toast kbd{background:rgba(255,255,255,.14);color:rgba(255,255,255,.8)}

@media (max-width:600px){
  header{padding:0 16px;height:64px}
  .progress{margin:0 16px}
  main{padding:48px 20px 136px}
  .word{font-size:36px}
  .quote{margin-top:36px}
  .row .w{min-width:7em}
  .list-head{flex-direction:column;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <button class="show-trigger" id="showTrigger" aria-haspopup="menu" aria-expanded="false"><span id="showTitle"></span><span class="icon" data-i="ChevronDown"></span></button>
  <div class="tools">
    <button class="icon-btn" id="listBtn" aria-pressed="false" aria-label="词表" title="词表"><span class="icon" data-i="Book"></span></button>
    <button class="icon-btn intent" id="moreBtn" aria-haspopup="menu" aria-expanded="false" aria-label="更多"><span class="icon" data-i="More"></span></button>
  </div>
</header>
<div class="progress" aria-hidden="true"><i id="bar"></i></div>

<div class="menu" id="rootMenu" role="menu"></div>
<div class="menu" id="subMenu" role="menu"></div>
<div class="menu" id="moreMenu" role="menu"></div>

<main>
  <section class="view" id="studyView"></section>
  <section class="view" id="listView" hidden></section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastText"></span><button id="toastUndo"><span>撤销</span><kbd id="undoKey">Ctrl Z</kbd></button></div>

<script>
const SHOWS = [
  { id: "clarksons-farm", title: "Clarkson's Farm", region: "uk", lang: "en-GB", quoted: true, words: [
    ["agricultural","ˌæɡrɪˈkʌltʃərəl","adj.","农业的","But it's restricted to [agricultural] use only.","S1E3 · Shopping","但它只限农业用途。"],
    ["complicated","ˈkɒmplɪkeɪtɪd","adj.","复杂的","Right away, I could tell he wasn't happy, because he thinks my tractor's too [complicated].","S1E8 · Harvesting","我一眼就看出他不高兴，因为他觉得我的拖拉机太复杂了。"],
    ["efficient","ɪˈfɪʃnt","adj.","高效的","I was reading the other day they're the most [efficient] farmers in Europe.","S5E3 · Tripping","我前几天看到，他们是全欧洲效率最高的农民。"],
    ["inevitable","ɪnˈevɪtəbl","adj.","不可避免的","After all these distractions, it was [inevitable] that at the end of play, the car park still wasn't finished.","S3E7 · Parking","被这么多事一耽误，收工时停车场还没修完，这是必然的。"],
    ["yield","jiːld","n.","产量","We're getting to a point where the [yield] is dropping off quite quickly.","S4E3 · Crawling","我们已经到了产量下滑得相当快的地步。"],
    ["harvest","ˈhɑːvɪst","v.","收割；收获","These flowers have gotta mature, ripen, in time for us to [harvest] them.","S3E1 · Unfarming","这些花得及时长成、成熟，我们才能收割。"],
    ["drought","draʊt","n.","干旱","So we got 30% less wheat than you were expecting because of the [drought].","S5E8 · Reaping","因为干旱，我们收的小麦比你预期的少了30%。"],
    ["unprecedented","ʌnˈpresɪdentɪd","adj.","前所未有的","The Wye here at its highest level since records began, clearly [unprecedented].","S1E1 · Tractoring","怀河这里的水位创下有记录以来的最高，显然是前所未有的。"],
    ["deteriorate","dɪˈtɪəriəreɪt","v.","变质；恶化","The longer they sat in the field too wet to harvest, the more they would [deteriorate].","S3E8 · Calculating","它们在地里湿得没法收，放得越久就越会变质。"],
    ["fertile","ˈfɜːtaɪl","adj.","能生育的；肥沃的","So End Game is [fertile].","S5E1 · Operating","所以 End Game 是有生育能力的。"],
    ["cultivate","ˈkʌltɪveɪt","v.","耕作；松土","Even if that meant planting them in fields that hadn't been [cultivated].","S1E1 · Tractoring","哪怕这意味着要把它们种在没耕过的地里。"],
    ["sustainable","səˈsteɪnəbl","adj.","可持续的","This part of the farm is so ecological and diverse and [sustainable] and good for global warming.","S1E2 · Sheeping","农场这一块非常生态、多样、可持续，对全球变暖也有好处。"],
    ["environmental","ɪnˌvaɪrənˈmentl","adj.","环境的；环保的","Then it was time to start some more [environmental] work in the woods.","S1E4 · Wilding","接着该在林子里再做些环保工作了。"],
    ["subsidy","ˈsʌbsədi","n.","补贴","So we know that you are going to lose £82,000 a year in [subsidy].","S2E1 · Surviving","所以我们知道你每年会少拿82,000英镑的补贴。"],
    ["budget","ˈbʌdʒɪt","v.","做预算；预计","We got nearly 40% less barley, 45% less durum than we [budgeted].","S5E8 · Reaping","我们收的大麦比预算少了近40%，硬粒小麦少了45%。"],
    ["convince","kənˈvɪns","v.","说服","Also, I had one ace up my sleeve that would hopefully [convince] her.","S4E2 · Pubbing","另外，我还有一张王牌，希望能说服她。"],
    ["investment","ɪnˈvestmənt","n.","投资","OK, it's a good [investment] if we're gonna keep on doing it.","S2E4 · Badgering","好，如果我们要一直做下去，这是笔不错的投资。"],
    ["profit","ˈprɒfɪt","n.","利润","You got a [profit] of £27,014, but it was a lot of work.","S3E8 · Calculating","你赚了27,014英镑的利润，不过活儿真不少。"],
    ["setback","ˈsetbæk","n.","挫折","Despite the [setbacks], though, we managed without Kaleb or Charlie to finish the pens.","S3E2 · Porking","不过尽管有这些挫折，没有 Kaleb 和 Charlie，我们还是把围栏建完了。"],
    ["determined","dɪˈtɜːmɪnd","adj.","下定决心的","I was [determined] to prove Nick wrong on this point, but that would take time.","S4E8 · Landlording","我下定决心要在这一点上证明 Nick 是错的，但这需要时间。"],
    ["incompetent","ɪnˈkɒmpɪtənt","adj.","无能的；不胜任的","You're just [incompetent] with a chainsaw.","S3E3 · Jobbing","你用电锯就是不行。"],
    ["reluctant","rɪˈlʌktənt","adj.","不情愿的","[Reluctant] though he was about welcoming in the new world order, as we drove away, Kaleb had to give Jacob his due.","S5E3 · Tripping","尽管 Kaleb 不太情愿接受这种新秩序，开车离开时，他还是得承认 Jacob 有两下子。"],
    ["compromise","ˈkɒmprəmaɪz","n.","折中办法；妥协","I've got a [compromise].","S5E7 · Sickening","我有个折中的办法。"],
    ["income","ˈɪnkʌm","n.","收入","You used to have a relatively stable [income] in terms of subsidies but they're going.","S3E8 · Calculating","你过去靠补贴有一份相对稳定的收入，但补贴正在取消。"],
    ["rural","ˈrʊərəl","adj.","乡村的","We live in a [rural] area and we have to support farmers.","S2E5 · Council-ing","我们住在乡村，我们得支持农民。"],
    ["livestock","ˈlaɪvstɒk","n.","牲畜","Who does the transportation of the [livestock]?","S1E6 · Melting","牲畜由谁来运？"],
    ["survive","səˈvaɪv","v.","存活","We'll make it our life's mission to make that piglet [survive].","S3E4 · Harrowing","我们要把救活那头小猪当成毕生使命。"],
    ["stubbornly","ˈstʌbənli","adv.","顽固地；执拗地","With the willow still [stubbornly] horizontal, I decided to deploy my chainsaw skills on its remaining branches.","S3E3 · Jobbing","柳树还是顽固地横在那儿，我决定用我的电锯技术去处理剩下的枝条。"],
    ["exhausted","ɪɡˈzɔːstɪd","adj.","精疲力竭的","By the evening, like everyone, I was [exhausted] from the ups and downs of the day.","S4E8 · Landlording","到了傍晚，跟大家一样，我被这一天的起起落落累垮了。"],
    ["pollinate","ˈpɒləneɪt","v.","授粉","The bees would make honey and money for the farm shop when it finally reopened and they'd also help [pollinate] my crops.","S1E4 · Wilding","等农场商店终于重新开门，蜜蜂能酿蜜赚钱，还能帮我的庄稼授粉。"],
    ["diversify","daɪˈvɜːsɪfaɪ","v.","多样化经营","We have been told as farmers to [diversify], and that is exactly what this proposal is.","S2E5 · Council-ing","上面一直叫我们农民多样化经营，而这份申请正是这么做的。"],
    ["venture","ˈventʃə(r)","n.","（有风险的）新事业","However, these [ventures] were all sideshows compared to the main event.","S1E7 · Fluffing","不过跟重头戏比起来，这些新项目都只是余兴节目。"],
    ["inspection","ɪnˈspekʃn","n.","检查","Yeah, so you've got your [inspection] this morning.","S1E6 · Melting","对，今天上午你有检查。"],
    ["planning permission","ˈplænɪŋ pəˈmɪʃn","n.","规划许可","'Cause I couldn't see a reason why they'd turn the [planning permission] down.","S2E6 · Counselling","因为我想不出他们有什么理由会驳回规划许可。"],
    ["objection","əbˈdʒekʃn","n.","反对意见","Charlie quickly emailed to explain how I should deal with the [objections].","S1E3 · Shopping","Charlie 很快发邮件来，告诉我该怎么应对这些反对意见。"],

    ["redundant","rɪˈdʌndənt","adj.","被裁员的；多余的","I was made [redundant] from the grind of day-to-day farming duties.","S4E1 · Solo-ing","我被从日复一日的繁重农活里“裁”了下来。"],
    ["regenerative","rɪˈdʒenərətɪv","adj.","再生的","[Regenerative] farming is a way of farming which tries to copy natural systems.","S3E2 · Porking","再生农业是一种试图模仿自然系统的耕作方式。"],
    ["renovation","ˌrenəˈveɪʃn","n.","翻新","With the pub [renovation] underway, I got back to the business of providing it with food.","S4E6 · Splurging","酒吧翻新正在进行，我又回去忙着给它供应食材。"],
    ["reservoir","ˈrezəvwɑː(r)","n.","储液罐；水库","No one knows where the brake [reservoir] is on this thing.","S4E2 · Pubbing","没人知道这东西的刹车油壶在哪儿。"],
    ["resistant","rɪˈzɪstənt","adj.","有抵抗力的","Then it'll have time to strengthen like that and then it'll be [resistant], and it'll be harder to get anything out of it.","S4E6 · Splurging","然后它就有时间那样变强，变得有抵抗力，就更难从里面弄出东西来了。"],
    ["ruthless","ˈruːθləs","adj.","无情的","The whole driving of that was just [ruthless].","S1E6 · Melting","那一路开得简直毫不留情。"],
    ["shortage","ˈʃɔːtɪdʒ","n.","短缺","The water [shortage] was a serious problem, but it wasn't the only thing that was bothering me.","S1E6 · Melting","缺水是个严重的问题，但这不是唯一让我烦心的事。"],
    ["sophisticated","səˈfɪstɪkeɪtɪd","adj.","老练的；精致的","Once Lucca had finished cooking, I just needed someone with a [sophisticated] palate to taste it.","S3E5 · Healing","等 Lucca 做完菜，我只需要找个口味讲究的人来尝一尝。"],
    ["spectacular","spekˈtækjələ(r)","adj.","壮观的；惊人的","And when the machine finally fell silent for the night, the results were [spectacular].","S1E4 · Wilding","当机器终于在夜里停下来时，效果非常壮观。"],
    ["statutory","ˈstætʃətri","adj.","法定的","It's a [statutory] requirement to notify the local authority.","S3E3 · Jobbing","通知地方当局是一项法定要求。"],
    ["sterile","ˈsteraɪl","adj.","无菌的","What we've done is, we've taken the jars out of the oven and they're nice and [sterile] now.","S2E2 · Cowering","我们做的是把罐子从烤箱里拿出来，现在它们很干净、无菌了。"],
    ["straightforward","ˌstreɪtˈfɔːwəd","adj.","简单的；直接的","Pleasantries over, it was time to choose what to buy, which I assumed would be fairly [straightforward].","S2E1 · Surviving","寒暄完毕，该挑买什么了，我以为这会相当简单。"],
    ["subsequent","ˈsʌbsɪkwənt","adj.","随后的","Sadly, though, on [subsequent] visits over the coming days, I kept finding evidence to the contrary.","S4E4 · Cottaging","可惜，在接下来几天的后续查看中，我不断发现相反的证据。"],
    ["sufficient","səˈfɪʃnt","adj.","足够的","They said we could have one lavatory, that was [sufficient].","S3E4 · Harrowing","他们说我们可以有一个厕所，那就足够了。"],
    ["susceptible","səˈseptəbl","adj.","易受影响的","OK, well if your friend's done it, he's [susceptible] to risk 12 months in prison.","S2E4 · Badgering","好，如果你朋友这么做了，他就可能面临坐牢12个月的风险。"],
    ["symptom","ˈsɪmptəm","n.","症状","I thought, no pubs and no Manchester United, he might be having withdrawal [symptoms].","S1E5 · Pan (dem) icking","我想，没有酒吧，也没有曼联，他可能会出现戒断症状。"],
    ["threshold","ˈθreʃhəʊld","n.","门槛；临界值","Their six hundred cows alone take them over the [threshold].","S5E1 · Operating","光是他们那六百头牛就超过了这个门槛。"],
    ["tranquillity","træŋˈkwɪləti","n.","宁静","Turning countryside into a car park and introducing additional congestion visually and on the transport network harms the AONB and its [tranquillity].","S2E5 · Council-ing","把乡村变成停车场，在视觉上和交通网络上增加拥堵，会损害这片杰出自然风景区及其宁静。"],
    ["traumatic","trɔːˈmætɪk","adj.","造成心理创伤的","The piglet deaths had been too [traumatic].","S3E5 · Healing","小猪的死实在太让人难受了。"],
    ["trivial","ˈtrɪviəl","adj.","微不足道的","I was hoping the problem was something [trivial]","S4E8 · Landlording","我本来希望问题不大"],
    ["unanimous","juˈnænɪməs","adj.","一致同意的","As the beer had had a [unanimous] thumbs up, I moved onto restaurant project number two: the potatoes.","S2E4 · Badgering","啤酒获得一致好评之后，我转向餐厅的第二个项目：土豆。"],
    ["unreliable","ˌʌnrɪˈlaɪəbl","adj.","不可靠的","The Lamborghini's been a bit [unreliable] since you went.","S4E3 · Crawling","你走之后，那台兰博基尼就有点靠不住了。"],
    ["worthwhile","ˌwɜːθˈwaɪl","adj.","值得的","But I assured him it would all be [worthwhile].","S2E7 · Scheming","但我向他保证，这一切都会是值得的。"]

  { id: "sherlock", title: "Sherlock", region: "uk", lang: "en-GB", words: [
    ["deduce","dɪˈdjuːs","v.","推断","Sherlock [deduced] where John had served from nothing more than his tan and his posture.","推理","Sherlock 仅凭 John 的晒痕和站姿，就推断出了他在哪里服过役。"],
    ["observant","əbˈzɜːvənt","adj.","善于观察的","Sherlock is so [observant] that a stain on a sleeve tells him a whole story.","推理","Sherlock 观察力极强，袖子上的一块污渍就能告诉他一整个故事。"],
    ["intuition","ˌɪntjuˈɪʃn","n.","直觉","John trusted his [intuition] about people more than Sherlock ever did.","推理","在看人这件事上，John 比 Sherlock 更相信自己的直觉。"],
    ["evidence","ˈevɪdəns","n.","证据","Lestrade needed hard [evidence], not just a brilliant theory.","案件","Lestrade 需要的是确凿的证据，而不只是一个精彩的推论。"],
    ["motive","ˈməʊtɪv","n.","动机","Every suspect seemed to have a [motive] but no opportunity.","案件","每个嫌疑人似乎都有动机，却都没有作案机会。"],
    ["alibi","ˈæləbaɪ","n.","不在场证明","The suspect's [alibi] collapsed the moment Sherlock checked the train times.","案件","Sherlock 一查火车时刻，嫌疑人的不在场证明就站不住了。"],
    ["accomplice","əˈkʌmplɪs","n.","同谋","The killer could not have acted alone; there had to be an [accomplice].","案件","凶手不可能单独作案，一定有个同谋。"],
    ["conspiracy","kənˈspɪrəsi","n.","阴谋","What began as a simple case grew into a [conspiracy] reaching the government.","案件","一桩简单的案子，最后变成了牵涉到政府的阴谋。"],
    ["deliberately","dɪˈlɪbərətli","adv.","故意地","The clues had been left [deliberately], as if someone wanted to be found.","Moriarty","这些线索是故意留下的，好像有人就想被找到。"],
    ["manipulate","məˈnɪpjuleɪt","v.","操纵","Moriarty loved to [manipulate] people into doing his work for him.","Moriarty","Moriarty 喜欢操纵别人替他干活。"],
    ["eccentric","ɪkˈsentrɪk","adj.","古怪的","Mrs Hudson had long accepted her tenant's [eccentric] habits.","221B","Mrs Hudson 早就接受了她这位房客的古怪习惯。"],
    ["arrogant","ˈærəɡənt","adj.","傲慢的","Sherlock can sound [arrogant], but he is usually right.","221B","Sherlock 说话听起来可能很傲慢，但他通常是对的。"]
  ]},
  { id: "downton-abbey", title: "Downton Abbey", region: "uk", lang: "en-GB", words: [
    ["aristocracy","ˌærɪˈstɒkrəsi","n.","贵族阶层","The war slowly changed what the [aristocracy] could take for granted.","楼上","战争慢慢改变了贵族阶层原本视为理所当然的一切。"],
    ["inherit","ɪnˈherɪt","v.","继承","Because Robert had no son, a distant cousin would [inherit] the estate.","继承","因为 Robert 没有儿子，庄园将由一位远房表亲继承。"],
    ["heir","eə(r)","n.","继承人","The sinking of the Titanic left the family without an [heir].","继承","泰坦尼克号沉没后，这个家族失去了继承人。"],
    ["estate","ɪˈsteɪt","n.","庄园；地产","Running the [estate] cost far more than its farms could earn.","继承","经营这座庄园的花费，远远超过它的农场能挣到的钱。"],
    ["hierarchy","ˈhaɪərɑːki","n.","等级制度","Below stairs, the [hierarchy] among the servants was just as strict as above.","楼下","楼下仆人之间的等级制度，和楼上一样严格。"],
    ["etiquette","ˈetɪket","n.","礼仪","Carson treated every rule of dinner [etiquette] as sacred.","楼下","Carson 把晚宴礼仪的每一条规矩都视为神圣。"],
    ["obligation","ˌɒblɪˈɡeɪʃn","n.","义务","Robert felt a deep [obligation] to the people who worked for him.","楼上","Robert 对为他工作的人有着深深的责任感。"],
    ["reputation","ˌrepjuˈteɪʃn","n.","名声","One scandal could ruin a family's [reputation] for a generation.","丑闻","一桩丑闻就能毁掉一个家族一代人的名声。"],
    ["scandal","ˈskændl","n.","丑闻","Mary's secret threatened to become the [scandal] of the season.","丑闻","Mary 的秘密眼看就要成为这一季最大的丑闻。"],
    ["conventional","kənˈvenʃənl","adj.","传统的；守旧的","Sybil had no interest in a [conventional] life of parties and marriage.","时代变化","Sybil 对那种整天派对、然后嫁人的传统生活毫无兴趣。"],
    ["decline","dɪˈklaɪn","n.","衰落","The family watched the slow [decline] of the old way of life.","时代变化","这个家族眼看着旧日的生活方式慢慢衰落。"],
    ["dignity","ˈdɪɡnəti","n.","尊严","Even in hard times, Mrs Hughes carried herself with quiet [dignity].","楼下","即使在艰难的时候，Mrs Hughes 也始终保持着安静的尊严。"]

  { id: "friends", title: "Friends", region: "us", lang: "en-US", words: [
    ["commitment","kəˈmɪtmənt","n.","承诺；投入","Chandler panicked at the faintest hint of [commitment].","感情","只要有一丁点要他承诺的迹象，Chandler 就会慌。"],
    ["reconcile","ˈrekənsaɪl","v.","和解","Ross and Rachel tried to [reconcile] more times than anyone could count.","感情","Ross 和 Rachel 尝试复合的次数，多得没人数得清。"],
    ["jealous","ˈdʒeləs","adj.","嫉妒的","Ross got [jealous] whenever Rachel mentioned someone from work.","感情","Rachel 一提到工作上的某个人，Ross 就会吃醋。"],
    ["awkward","ˈɔːkwəd","adj.","尴尬的","The silence after the wrong name at the wedding was painfully [awkward].","感情","婚礼上叫错名字之后的沉默，尴尬得让人难受。"],
    ["sarcastic","sɑːˈkæstɪk","adj.","讽刺的","Chandler hid every nervous moment behind a [sarcastic] joke.","Chandler","Chandler 每次紧张，都会用一句讽刺的玩笑掩饰过去。"],
    ["hilarious","hɪˈleəriəs","adj.","极其滑稽的","Joey's attempts at acting were often accidentally [hilarious].","Joey","Joey 的演戏尝试常常好笑得出人意料。"],
    ["audition","ɔːˈdɪʃn","n.","试镜","Joey turned up to every [audition] convinced this was his big break.","Joey","Joey 每次去试镜，都坚信这就是他的大好机会。"],
    ["spontaneous","spɒnˈteɪniəs","adj.","自发的；随性的","Phoebe was the most [spontaneous] person in the group.","Phoebe","Phoebe 是这群人里最随性的一个。"],
    ["eccentric","ɪkˈsentrɪk","adj.","古怪的","Phoebe's songs were as [eccentric] as her stories about her past.","Phoebe","Phoebe 的歌和她讲的那些过去的故事一样古怪。"],
    ["obsessive","əbˈsesɪv","adj.","强迫的；着迷的","Monica was [obsessive] about keeping the apartment spotless.","Monica","Monica 对保持公寓一尘不染有种强迫症般的执着。"],
    ["competitive","kəmˈpetətɪv","adj.","好胜的","Monica became fiercely [competitive] at even the simplest game.","Monica","哪怕是最简单的游戏，Monica 也会变得极其好胜。"],
    ["loyal","ˈlɔɪəl","adj.","忠诚的","Whatever happened, the six of them stayed [loyal] to one another.","Central Perk","无论发生什么，他们六个人始终对彼此忠诚。"]
  ]},
  { id: "breaking-bad", title: "Breaking Bad", region: "us", lang: "en-US", words: [
    ["diagnosis","ˌdaɪəɡˈnəʊsɪs","n.","诊断","Walter's cancer [diagnosis] changed everything in a single afternoon.","Walter","一个下午，Walter 的癌症诊断就改变了一切。"],
    ["desperate","ˈdespərət","adj.","绝望的；不顾一切的","[Desperate] to provide for his family, Walter made a terrible choice.","Walter","为了养家，走投无路的 Walter 做了一个可怕的选择。"],
    ["transformation","ˌtrænsfəˈmeɪʃn","n.","转变","The show traces Walter's [transformation] from teacher to criminal.","Walter","这部剧讲述了 Walter 从老师变成罪犯的转变。"],
    ["arrogance","ˈærəɡəns","n.","傲慢","In the end, it was Walter's [arrogance] that undid him.","Walter","最终，毁掉 Walter 的正是他的傲慢。"],
    ["integrity","ɪnˈteɡrəti","n.","正直","Hank never lost his [integrity], even when the case became personal.","Hank","即使案子牵涉到自己人，Hank 也从未失去他的正直。"],
    ["suspicious","səˈspɪʃəs","adj.","怀疑的；可疑的","Skyler grew [suspicious] of Walter's long, unexplained absences.","Skyler","Walter 长时间不明原因地不见人影，让 Skyler 越来越起疑。"],
    ["deceive","dɪˈsiːv","v.","欺骗","Walter had to [deceive] everyone he loved to keep his secret.","Skyler","为了守住秘密，Walter 不得不欺骗他爱的每一个人。"],
    ["consequence","ˈkɒnsɪkwəns","n.","后果","Every lie seemed to have a worse [consequence] than the last.","代价","每一个谎言的后果似乎都比上一个更糟。"],
    ["ruthless","ˈruːθləs","adj.","无情的","Gus was calm, polite and completely [ruthless].","Gus","Gus 冷静、有礼，而且彻底冷酷无情。"],
    ["manipulate","məˈnɪpjuleɪt","v.","操纵","Walter learned to [manipulate] Jesse with guilt and false kindness.","Jesse","Walter 学会了用内疚和虚假的关心来操纵 Jesse。"],
    ["illegal","ɪˈliːɡl","adj.","非法的","The [illegal] business grew faster than Walter could control.","代价","这门非法生意扩张得太快，Walter 已经控制不住。"],
    ["remorse","rɪˈmɔːs","n.","悔恨","Jesse was eaten up by [remorse] in a way Walter never was.","Jesse","Jesse 被悔恨吞噬，而 Walter 从来没有这样过。"]

const MASTERED_BOX = 4;
const BATCH = 10;
const REQUEUE_GAP = 3;

/* ---------- persistence (silent, automatic) ---------- */
const KV = (() => { try { const s = window.localStorage; s.setItem("__t","1"); s.removeItem("__t"); return s; } catch (e) { return null; } })();
const mem = {};
const store = {
  get(k, d) { try { const v = KV ? KV.getItem(k) : mem[k]; return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { const s = JSON.stringify(v); try { KV ? KV.setItem(k, s) : (mem[k] = s); } catch (e) { mem[k] = s; } }
};
const prefs = Object.assign({ show: "clarksons-farm", speak: true }, store.get("jc.prefs", {}));
const progress = store.get("jc.progress", {});
const savePrefs = () => store.set("jc.prefs", prefs);
const saveProgress = () => store.set("jc.progress", progress);

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const icon = n => `<span class="icon" aria-hidden="true">${svg(n)}</span>`;
const svg = n => `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">${ICONS[n] || ""}</svg>`;
const mark = s => esc(s).replace(/\[(.+?)\]/g, "<mark>$1</mark>");
const plain = s => s.replace(/[\[\]]/g, "");
const showById = id => SHOWS.find(s => s.id === id) || SHOWS[0];
const entry = (show, i) => { const p = progress[show.id] || (progress[show.id] = {}); return p[i]; };
function statusOf(show, i) { const e = entry(show, i); if (!e) return "new"; return e.box >= MASTERED_BOX ? "known" : "learning"; }
function counts(show) { const c = {new:0, learning:0, known:0}; show.words.forEach((_, i) => c[statusOf(show, i)]++); return c; }
function hydrateIcons(root = document) { root.querySelectorAll("[data-i]").forEach(el => { el.innerHTML = svg(el.dataset.i); el.removeAttribute("data-i"); }); }

/* ---------- speech: the system picks the accent from the show ---------- */
let voices = [];
const canSpeak = "speechSynthesis" in window;
function loadVoices() { voices = canSpeak ? speechSynthesis.getVoices() : []; }
if (canSpeak) { loadVoices(); speechSynthesis.onvoiceschanged = () => { loadVoices(); render(); }; }
function voiceFor(lang) { return voices.find(v => v.lang === lang) || voices.find(v => v.lang && v.lang.startsWith("en")) || null; }
function speak(text, lang) {
  if (!canSpeak) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang; const v = voiceFor(lang); if (v) u.voice = v; u.rate = .92;
  speechSynthesis.speak(u);
}

/* ---------- session: the system decides what to study ---------- */
let show = showById(prefs.show);
let session = null;
const sessions = {};
let history = [];
let view = "study";
let listFilter = "all";
let openRow = null;
let spell = null;

const lettersOf = w => w.toLowerCase().replace(/[^a-z]/g, "").split("");
function shuffle(a) { a = a.slice(); for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; }

/* New words: recognise first, then spell. Words already recognised come back as spelling. */
function buildSession() {
  const now = Date.now();
  const due = [], fresh = [];
  show.words.forEach((_, i) => { const e = entry(show, i); if (!e) fresh.push(i); else if (e.due <= now) due.push(i); });
  due.sort((a, b) => entry(show, a).due - entry(show, b).due);
  const queue = due.map(i => ({ i, k: entry(show, i).box >= 1 ? "spell" : "recall" }))
    .concat(fresh.slice(0, BATCH).map(i => ({ i, k: "recall" })));
  session = { queue, total: queue.length, done: 0, revealed: false, today: session && session.show === show.id ? session.today : 0, show: show.id };
  dropSpell();
}

function current() { return session.queue[0]; }
function snapshot(i) {
  const before = entry(show, i) ? Object.assign({}, entry(show, i)) : null;
  history.push({ show: show.id, i, before, queue: session.queue.slice(), done: session.done, total: session.total, today: session.today });
  return before;
}
function requeue(item) { session.queue.splice(Math.min(REQUEUE_GAP, session.queue.length), 0, item); }

function grade(remembered) {
  const c = current(); if (!c || c.k !== "recall") return;
  const before = snapshot(c.i);
  const e = before ? Object.assign({}, before) : { box: 0, due: 0, seen: 0 };
  e.seen++; e.box = 0; e.due = Date.now();
  progress[show.id][c.i] = e; saveProgress();
  session.queue.shift();
  requeue({ i: c.i, k: remembered ? "spell" : "recall" });
  session.revealed = false;
  toast(remembered ? "记得 · 稍后拼写" : "忘了 · 稍后再出现", undo);
  transition(() => render());
}

function finishSpell(clean) {
  const c = current();
  if (!c || c.k !== "spell" || !spell || spell.i !== c.i || spell.show !== show.id) return;
  const before = snapshot(c.i);
  const e = before ? Object.assign({}, before) : { box: 0, due: 0, seen: 0 };
  e.seen++;
  session.queue.shift();
  if (clean) { e.box = Math.min(e.box + 1, INTERVALS.length - 1); e.due = Date.now() + INTERVALS[e.box]; session.done++; session.today++; }
  else { e.box = 0; e.due = Date.now(); requeue({ i: c.i, k: "spell" }); }
  progress[show.id][c.i] = e; saveProgress();
  dropSpell();
  toast(clean ? "拼对了" : "稍后再拼一次", undo);
  transition(() => render());
}

function undo() {
  const h = history.pop(); if (!h) return;
  dropSpell();
  if (h.show !== show.id) { sessions[show.id] = session; show = showById(h.show); prefs.show = show.id; savePrefs(); session = sessions[h.show] || session; }
  if (h.before) progress[h.show][h.i] = h.before; else delete progress[h.show][h.i];
  saveProgress();
  session.show = h.show; session.queue = h.queue; session.done = h.done; session.total = h.total; session.today = h.today;
  session.revealed = !!(session.queue[0] && session.queue[0].k === "recall");
  hideToast(); setView("study"); transition(() => render(), true);
}

function reveal(force) {
  const c = current(); if (!c || c.k !== "recall") return;
  session.revealed = force == null ? !session.revealed : force;
  const card = $(".card"); if (card) card.classList.toggle("revealed", session.revealed);
  document.querySelectorAll(".card .meaning, .card .trans").forEach(m => m.setAttribute("aria-hidden", String(!session.revealed)));
  const a = $("#actions"); if (a) a.innerHTML = actionsHTML();
  if (session.revealed && prefs.speak) speak(show.words[c.i][0], show.lang);
}

/* ---------- spelling (letter wheel, after Word Forest) ---------- */
const MAX_ERRORS = 2;
function dropSpell() { if (spell && spell.timer) clearTimeout(spell.timer); spell = null; drag = null; }
function startSpell(i) {
  const word = show.words[i][0], ans = lettersOf(word);
  let order = ans.map((_, k) => k);
  for (let n = 0; n < 12; n++) { order = shuffle(order); if (ans.length < 3 || order.some((v, k) => ans[v] !== ans[k])) break; }
  spell = { i, show: show.id, word, ans, tiles: order.map(k => ans[k]), used: [], hinted: [], errors: 0, hints: 0, state: "typing", bad: -1, timer: 0 };
  if (prefs.speak) speak(word, show.lang);
}
const typed = () => spell.used.map(t => spell.tiles[t]);
function firstWrong() { const ty = typed(); for (let k = 0; k < ty.length; k++) if (ty[k] !== spell.ans[k]) return k; return -1; }

function addTile(t) {
  if (!spell || spell.state !== "typing" || spell.used.includes(t) || spell.used.length >= spell.ans.length) return;
  spell.used.push(t); paintSpell();
  if (spell.used.length === spell.ans.length) checkSpell();
}
function removeLast() {
  if (!spell || spell.state !== "typing" || !spell.used.length) return;
  spell.used.pop(); spell.hinted = spell.hinted.filter(k => k < spell.used.length); paintSpell();
}
function typeKey(ch) {
  if (!spell || spell.state !== "typing") return;
  const t = spell.tiles.findIndex((l, k) => l === ch && !spell.used.includes(k));
  if (t < 0) { nudge($("#wheel")); return; }
  addTile(t);
}
function hint() {
  if (!spell || spell.state !== "typing") return;
  const w = firstWrong(); if (w >= 0) { spell.used = spell.used.slice(0, w); spell.hinted = spell.hinted.filter(k => k < w); }
  const need = spell.ans[spell.used.length]; if (need == null) return;
  const t = spell.tiles.findIndex((l, k) => l === need && !spell.used.includes(k));
  spell.hints++; spell.hinted.push(spell.used.length); addTile(t);
}
function checkSpell() {
  const w = firstWrong();
  if (w < 0) {
    if (!spell.errors && !spell.hints) {
      spell.state = "done"; paintSpell(); speak(spell.word, show.lang);
      spell.timer = setTimeout(() => finishSpell(true), 900);
    } else { spell.state = "failed"; spell.prefix = spell.ans.length; paintSpell(); speak(spell.word, show.lang); }
    return;
  }
  spell.errors++; spell.state = "wrong"; spell.bad = w; paintSpell(); nudge($("#slots"));
  spell.timer = setTimeout(() => {
    if (!spell) return;
    spell.bad = -1;
    if (spell.errors >= MAX_ERRORS) { spell.state = "failed"; spell.prefix = w; speak(spell.word, show.lang); }
    else { spell.state = "typing"; spell.used = spell.used.slice(0, w); spell.hinted = spell.hinted.filter(k => k < w); }
    paintSpell();
  }, 560);
}
function nudge(el) { if (!el) return; el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }

function spellActionsHTML() {
  if (spell.state === "failed") return `<button class="btn btn-main btn-wide" data-act="next">继续<kbd>Enter</kbd></button>`;
  if (spell.state === "done") return `<button class="btn btn-quiet btn-wide" tabindex="-1" style="visibility:hidden">继续</button>`;
  return `<button class="btn btn-quiet btn-wide" data-act="hint">提示<kbd>/</kbd></button>`;
}
function paintSpell() {
  if (!spell) return;
  const slots = $("#slots"), wheel = $("#wheel"); if (!slots || !wheel) return;
  const failed = spell.state === "failed";
  const shown = failed ? spell.ans : typed();
  slots.classList.toggle("ok", spell.state === "done");
  slots.querySelectorAll(".slot").forEach((s, k) => {
    s.textContent = shown[k] || "";
    s.classList.toggle("filled", k < shown.length);
    s.classList.toggle("next", spell.state === "typing" && k === shown.length);
    s.classList.toggle("bad", spell.state === "wrong" && k >= spell.bad);
    s.classList.toggle("hinted", spell.hinted.includes(k));
    s.classList.toggle("given", failed && k >= correctPrefix());
  });
  wheel.querySelectorAll(".tile").forEach((el, k) => el.classList.toggle("on", spell.used.includes(k) && !failed));
  wheel.classList.toggle("idle", spell.state === "done" || failed);
  const back = wheel.querySelector(".center"); if (back) back.hidden = !(spell.state === "typing" && spell.used.length);
  drawPath();
  const solved = spell.state === "done" || failed;
  const q = $(".quote"); if (q) q.innerHTML = quoteHTML(show.words[spell.i][4], !solved);
  const a = $("#actions"); if (a) a.innerHTML = spellActionsHTML();
}
function correctPrefix() { return spell.prefix || 0; }
function quoteHTML(sent, blank) {
  const body = blank ? esc(sent).replace(/\[(.+?)\]([.,!?;:…]*)/g, '<span class="nw"><span class="blank" aria-label="空缺"></span>$2</span>') : mark(sent);
  return show.quoted ? `“${body}”` : body;
}

/* wheel geometry + drag-to-connect */
let drag = null;
function wheelGeo(n, avail) {
  let T = n <= 8 ? 56 : n <= 12 ? 48 : 40;
  let R = Math.max(T * 1.3, (n * (T + 12)) / (2 * Math.PI));
  let S = 2 * R + T;
  if (S > avail) { const k = avail / S; T = Math.max(36, Math.floor(T * k / 4) * 4); R = (avail - T) / 2; S = avail; }
  const pts = []; for (let k = 0; k < n; k++) { const a = -Math.PI / 2 + k * 2 * Math.PI / n; pts.push({ x: S / 2 + R * Math.cos(a), y: S / 2 + R * Math.sin(a) }); }
  /* swipe radius: wide enough to catch a letter, narrow enough that a straight swipe never grabs the letter it passes */
  const reach = Math.min(0.45 * T, 0.8 * R * (1 - Math.cos(2 * Math.PI / n))) / T;
  return { T, R, S, pts, reach };
}
function tileAt(x, y, reach = 0.55) {
  const wheel = $("#wheel"); if (!wheel || !spell || !spell.geo) return null;
  const r = wheel.getBoundingClientRect(), g = spell.geo, px = x - r.left, py = y - r.top;
  let best = null, bd = Infinity;
  g.pts.forEach((p, k) => { const d = Math.hypot(p.x - px, p.y - py); if (d < bd) { bd = d; best = k; } });
  return bd <= g.T * reach ? best : null;
}
function drawPath(pt) {
  const svg = $("#wheel svg"); if (!svg || !spell || !spell.geo) return;
  const pts = spell.state === "failed" ? [] : spell.used.map(k => spell.geo.pts[k]);
  if (pt && pts.length) pts.push(pt);
  svg.innerHTML = pts.length > 1 ? `<polyline points="${pts.map(p => `${p.x},${p.y}`).join(" ")}"/>` : "";
}
function bindWheel() {
  const wheel = $("#wheel"); if (!wheel) return;
  const rel = e => { const r = wheel.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  wheel.addEventListener("pointerdown", e => {
    if (e.target.closest(".center")) return;
    if (!spell || spell.state !== "typing") return;
    const t = tileAt(e.clientX, e.clientY); if (t == null) return;
    e.preventDefault();
    if (spell.used.includes(t)) { if (t === spell.used[spell.used.length - 1]) removeLast(); return; }
    drag = { id: e.pointerId }; try { wheel.setPointerCapture(e.pointerId); } catch (_) {}
    addTile(t); if (spell && spell.state === "typing") drawPath(rel(e));
  });
  wheel.addEventListener("pointermove", e => {
    if (!drag || drag.id !== e.pointerId || !spell || spell.state !== "typing") return;
    const t = tileAt(e.clientX, e.clientY, spell.geo.reach);
    if (t != null) {
      if (!spell.used.includes(t)) addTile(t);
      else if (t === spell.used[spell.used.length - 2]) removeLast();
    }
    if (spell && spell.state === "typing") drawPath(rel(e));
  });
  const end = e => {
    if (!drag || drag.id !== e.pointerId) return;
    drag = null;
    if (e.type === "pointerup" && spell && spell.state === "typing") { const t = tileAt(e.clientX, e.clientY); if (t != null && !spell.used.includes(t)) addTile(t); }
    drawPath();
  };
  wheel.addEventListener("pointerup", end); wheel.addEventListener("pointercancel", end);
}

/* ---------- rendering ---------- */
function render() {
  $("#showTitle").textContent = show.title;
  const pct = session.total ? (session.done / session.total) * 100 : 100;
  $("#bar").style.width = pct + "%";
  $("#listBtn").setAttribute("aria-pressed", view === "list");
  document.querySelector(".progress").style.visibility = view === "study" ? "visible" : "hidden";
  $("#studyView").hidden = view !== "study";
  $("#listView").hidden = view !== "list";
  if (view === "study") renderStudy(); else renderList();
}

function actionsHTML() {
  if (!session.revealed) return `<button class="btn btn-quiet btn-wide" data-act="reveal">显示释义<kbd>Space</kbd></button>`;
  return `<button class="btn btn-quiet" data-act="forgot">忘了<kbd>←</kbd></button><button class="btn btn-main" data-act="known">记得<kbd>→</kbd></button>`;
}

function renderStudy() {
  const el = $("#studyView");
  const c = current();
  if (c == null) {
    dropSpell();
    const cnt = counts(show);
    const next = show.words.map((_, k) => entry(show, k)).filter(Boolean).map(e => e.due).filter(d => d > Date.now()).sort((a,b)=>a-b)[0];
    const more = cnt.new > 0;
    el.innerHTML = `<div class="done">
      <h2>今天完成</h2>
      <div class="big">${session.today}<span class="unit">个</span></div>
      <div class="stats"><span>已掌握 ${cnt.known}</span><span>学习中 ${cnt.learning}</span><span>未学 ${cnt.new}</span>${!more && next ? `<span>下次复习 ${whenText(next)}</span>` : ""}</div>
      ${more ? `<div class="actions"><button class="btn btn-main" data-act="more">再学 ${Math.min(BATCH, cnt.new)} 个<kbd>Enter</kbd></button></div>` : ""}
    </div>`;
    return;
  }
  const [w, ipa, pos, cn, sent, tag, zh] = show.words[c.i];
  if (c.k === "spell") { renderSpell(c.i); return; }
  dropSpell();
  el.innerHTML = `<article class="card${session.revealed ? " revealed" : ""}" tabindex="-1" data-act="card">
    <div class="headword"><h1 class="word">${esc(w)}</h1>${canSpeak ? `<button class="icon-btn say" data-act="say" aria-label="发音" title="发音">${icon("VolumeHigh")}</button>` : ""}</div>
    <div class="phon"><b>${esc(pos)}</b>/${esc(ipa)}/</div>
    <p class="quote">${quoteHTML(sent, false)}</p>
    ${zh ? `<p class="trans" aria-hidden="${!session.revealed}">${esc(zh)}</p>` : ""}
    <div class="scene">${esc(show.title)} · ${esc(tag)}</div>
    <div class="meaning" aria-hidden="${!session.revealed}">${esc(cn)}</div>
  </article>
  <div class="actions" id="actions">${actionsHTML()}</div>`;
}

function renderSpell(i) {
  if (!spell || spell.i !== i || spell.show !== show.id) startSpell(i);
  const el = $("#studyView");
  const [w, ipa, pos, cn, sent, tag, zh] = show.words[i];
  const avail = Math.min(el.clientWidth || 600, 608);
  const n = spell.ans.length;
  /* each word of a phrase stays on one line; a phrase that doesn't fit wraps between words */
  const parts = w.split(" "), oneLine = n + (parts.length - 1) * 3;
  const fit = m => (avail - (m - 1) * 4) / m;
  let sw = fit(oneLine);
  if (sw < 20 && parts.length > 1) sw = fit(Math.max(...parts.map(p => lettersOf(p).length)));
  sw = sw >= 16 ? Math.min(32, Math.floor(sw / 4) * 4) : Math.max(10, Math.floor(sw));
  const sf = Math.max(14, Math.min(28, Math.round(sw * 0.9 / 2) * 2));
  let k = 0;
  const slots = parts.map(p => `<span class="sw">${lettersOf(p).map(() => `<span class="slot" data-k="${k++}"></span>`).join("")}</span>`).join("");
  const g = spell.geo = wheelGeo(n, Math.min(avail, 360));
  const tiles = spell.tiles.map((l, k) => { const p = g.pts[k]; return `<span class="tile" style="left:${p.x - g.T / 2}px;top:${p.y - g.T / 2}px;width:${g.T}px;height:${g.T}px">${l}</span>`; }).join("");
  el.innerHTML = `<article class="card spell" tabindex="-1">
    <div class="prompt"><span><b>${esc(pos)}</b>${esc(cn)}</span>${canSpeak ? `<button class="icon-btn say" data-act="say" aria-label="发音" title="发音">${icon("VolumeHigh")}</button>` : ""}</div>
    <p class="quote">${quoteHTML(sent, true)}</p>
    ${zh ? `<p class="trans">${esc(zh)}</p>` : ""}
    <div class="scene">${esc(show.title)} · ${esc(tag)}</div>
    <div class="slots" id="slots" style="--sw:${sw}px;--sf:${sf}px" aria-live="polite">${slots}</div>
  </article>
  <div class="wheel" id="wheel" style="width:${g.S}px;height:${g.S}px;--tf:${g.T >= 48 ? 22 : 18}px" aria-hidden="true"><svg width="${g.S}" height="${g.S}"></svg>${tiles}<button class="icon-btn center" data-act="back" aria-label="删除" title="删除  Backspace" hidden>${icon("Backspace")}</button></div>
  <div class="actions" id="actions"></div>`;
  bindWheel(); paintSpell();
}

function whenText(t) {
  const d = Math.round((t - Date.now()) / DAY);
  if (d <= 0) return "今天稍后"; if (d === 1) return "明天"; return `${d} 天后`;
}

function renderList() {
  const el = $("#listView");
  const c = counts(show);
  const filters = [["all","全部",show.words.length],["learning","学习中",c.learning],["known","已掌握",c.known],["new","未学",c.new]];
  const rows = show.words.map((w, i) => ({ w, i, s: statusOf(show, i) })).filter(r => listFilter === "all" || r.s === listFilter);
  el.innerHTML = `<div class="list-head"><h2>${esc(show.title)}</h2>
    <div class="seg" role="group">${filters.map(([id, t, n]) => `<button data-filter="${id}" aria-pressed="${listFilter === id}">${t} ${n}</button>`).join("")}</div></div>
    ${rows.length ? `<ul class="rows">${rows.map(({w, i, s}) => `<li class="row">
      <div class="row-line"><button class="row-main" data-row="${i}" aria-expanded="${openRow === i}"><span class="dot ${s}"></span><span class="w">${esc(w[0])}</span><span class="m">${esc(w[3])}</span></button>${canSpeak ? `<button class="icon-btn say" data-say="${i}" aria-label="发音 ${esc(w[0])}">${icon("VolumeHigh")}</button>` : ""}</div>
      ${openRow === i ? `<div class="row-detail"><div>${show.quoted ? `“${mark(w[4])}”` : mark(w[4])}</div>${w[6] ? `<div class="trans">${esc(w[6])}</div>` : ""}<div class="scene">/${esc(w[1])}/ · ${esc(w[5])}</div></div>` : ""}
    </li>`).join("")}</ul>` : `<div class="empty">—</div>`}`;
}

function setView(v) { if (v === "list" && view !== "list") listFilter = "all"; view = v; openRow = null; render(); }

function transition(fn, back) {
  const v = $("#studyView");
  if (view !== "study" || !v.firstElementChild || matchMedia("(prefers-reduced-motion: reduce)").matches) { fn(); return; }
  v.classList.add("leaving");
  setTimeout(() => { v.classList.remove("leaving"); v.classList.add("entering"); fn(); requestAnimationFrame(() => requestAnimationFrame(() => v.classList.remove("entering"))); }, 140);
}

/* ---------- toast with undo (never steals focus) ---------- */
let toastTimer, toastAction;
function toast(text, action) {
  $("#toastText").textContent = text; toastAction = action;
  $("#toastUndo").hidden = !action;
  $("#toast").classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 5000);
}
function hideToast() { $("#toast").classList.remove("show"); }
$("#toastUndo").addEventListener("mousedown", e => e.preventDefault());
$("#toastUndo").addEventListener("click", () => toastAction && toastAction());

/* ---------- show menu: hover intent + safe triangle ---------- */
const OPEN_DELAY = 90, CLOSE_DELAY = 320, AIM_DELAY = 320;
const root = $("#rootMenu"), sub = $("#subMenu"), trigger = $("#showTrigger");
let activeRegion = null, closeT, aimAnchor = null, lastPt = {x:0, y:0};

function buildRoot() {
  root.innerHTML = REGIONS.map(r => `<button class="mi" role="menuitem" data-region="${r.id}" aria-haspopup="menu"><span>${r.title}</span>${icon("ChevronRight")}</button>`).join("");
}
function buildSub(regionId) {
  const list = SHOWS.filter(s => s.region === regionId);
  sub.innerHTML = list.map(s => { const c = counts(s); return `<button class="mi${s.id === show.id ? " current" : ""}" role="menuitemradio" aria-checked="${s.id === show.id}" data-show="${s.id}"><span>${esc(s.title)}</span><span class="meta">${c.known + c.learning ? `${c.known + c.learning}/${s.words.length}` : `${s.words.length} 词`}</span></button>`; }).join("");
}
function place(menu, x, y) { menu.style.left = x + "px"; menu.style.top = y + "px"; }
function openRoot() {
  closeMore();
  buildRoot();
  const r = trigger.getBoundingClientRect();
  place(root, r.left, r.bottom + 8);
  root.classList.add("open"); trigger.setAttribute("aria-expanded", "true");
  openRegion(show.region, true);
}
function closeRoot() {
  root.classList.remove("open"); sub.classList.remove("open"); trigger.setAttribute("aria-expanded", "false");
  activeRegion = null; aimAnchor = null; cancelPending(); clearTimeout(closeT);
}
function openRegion(id, instant) {
  activeRegion = id;
  root.querySelectorAll("[data-region]").forEach(b => b.classList.toggle("active", b.dataset.region === id));
  buildSub(id);
  const item = root.querySelector(`[data-region="${id}"]`).getBoundingClientRect();
  const rr = root.getBoundingClientRect();
  let x = rr.right + 4, y = item.top - 8;
  const w = 248;
  if (x + w > innerWidth - 8) x = Math.max(8, rr.left + 24), y = rr.bottom + 4;
  place(sub, x, y); sub.style.minWidth = w + "px";
  sub.classList.add("open");
}
function inTriangle(p, a, b, c) {
  const s = (p1, p2, p3) => (p1.x - p3.x) * (p2.y - p3.y) - (p2.x - p3.x) * (p1.y - p3.y);
  const d1 = s(p, a, b), d2 = s(p, b, c), d3 = s(p, c, a);
  const neg = d1 < 0 || d2 < 0 || d3 < 0, pos = d1 > 0 || d2 > 0 || d3 > 0;
  return !(neg && pos);
}
/* Safe triangle: apex = last pointer position inside the parent item, base = near edge of the open submenu. */
function aiming() {
  if (!aimAnchor || !sub.classList.contains("open")) return false;
  const r = sub.getBoundingClientRect();
  const nearX = r.left >= aimAnchor.x ? r.left : r.right;
  return inTriangle(lastPt, aimAnchor, {x: nearX, y: r.top - 4}, {x: nearX, y: r.bottom + 4});
}
let pending = null;
function hoveredRegion() { const el = document.elementFromPoint(lastPt.x, lastPt.y); const it = el && el.closest && el.closest("#rootMenu [data-region]"); return it ? it.dataset.region : null; }
function schedule(id, kind) {
  if (pending && pending.id === id && pending.kind === kind) return;
  if (pending) clearTimeout(pending.t);
  pending = { id, kind, t: setTimeout(() => { pending = null; if (hoveredRegion() === id) openRegion(id); }, kind === "aim" ? AIM_DELAY : OPEN_DELAY) };
}
function cancelPending() { if (pending) clearTimeout(pending.t); pending = null; }
document.addEventListener("mousemove", e => {
  lastPt = {x: e.clientX, y: e.clientY};
  if (!root.classList.contains("open")) return;
  const overRoot = root.contains(e.target), overSub = sub.contains(e.target), overTrig = trigger.contains(e.target);
  clearTimeout(closeT);
  if (!(overRoot || overSub || overTrig)) closeT = setTimeout(() => { if (!aiming()) closeRoot(); }, CLOSE_DELAY);
  if (overSub) { aimAnchor = null; cancelPending(); return; }
  const item = e.target.closest && e.target.closest("#rootMenu [data-region]");
  if (item && item.dataset.region === activeRegion) { aimAnchor = {x: lastPt.x, y: lastPt.y}; cancelPending(); return; }
  const isAiming = aiming();
  if (!isAiming) aimAnchor = null;
  if (item) schedule(item.dataset.region, isAiming ? "aim" : "open");
});
root.addEventListener("click", e => { const item = e.target.closest("[data-region]"); if (item) { openRegion(item.dataset.region); const f = sub.querySelector(".mi"); f && f.focus(); } });
sub.addEventListener("click", e => { const item = e.target.closest("[data-show]"); if (item) switchShow(item.dataset.show); });
trigger.addEventListener("click", () => root.classList.contains("open") ? closeRoot() : openRoot());

function switchShow(id) {
  closeRoot();
  if (id === show.id) return;
  sessions[show.id] = session; dropSpell();
  show = showById(id); prefs.show = id; savePrefs();
  session = sessions[id] || null; if (!session) buildSession(); openRow = null;
  transition(() => render());
  if (view === "study") requestAnimationFrame(() => { const c = $(".card"); c && c.focus({preventScroll:true}); });
}

/* menu keyboard */
function menuKeys(e) {
  const menus = [root, sub, more].filter(m => m.classList.contains("open"));
  if (!menus.length) return false;
  const inMenu = menus.find(m => m.contains(document.activeElement));
  if (e.key === "Escape") { closeRoot(); closeMore(); trigger.focus(); return true; }
  if (!inMenu) { if (e.key === "ArrowDown") { const f = menus[0].querySelector(".mi"); f && f.focus(); return true; } return false; }
  const items = [...inMenu.querySelectorAll(".mi")]; const k = items.indexOf(document.activeElement);
  if (e.key === "ArrowDown") { items[(k + 1) % items.length].focus(); return true; }
  if (e.key === "ArrowUp") { items[(k - 1 + items.length) % items.length].focus(); return true; }
  if (e.key === "ArrowRight" && inMenu === root) { const id = document.activeElement.dataset.region; openRegion(id); sub.querySelector(".mi").focus(); return true; }
  if (e.key === "ArrowLeft" && inMenu === sub) { root.querySelector(`[data-region="${activeRegion}"]`).focus(); return true; }
  return e.key === " " || e.key === "Enter" ? false : true;
}

/* ---------- more menu ---------- */
const more = $("#moreMenu"), moreBtn = $("#moreBtn");
function buildMore() {
  more.innerHTML = `<button class="mi" role="menuitemcheckbox" aria-checked="${prefs.speak}" data-more="speak"><span>自动发音</span>${prefs.speak ? icon("Check") : ""}</button>
  <button class="mi danger" role="menuitem" data-more="reset"><i class="fill"></i><span id="resetLabel">重置 ${esc(show.title)}</span></button>`;
}
function openMore() { closeRoot(); buildMore(); const r = moreBtn.getBoundingClientRect(); more.style.minWidth = "232px"; place(more, Math.max(8, r.right - 232), r.bottom + 8); more.classList.add("open"); moreBtn.setAttribute("aria-expanded","true"); }
function closeMore() { more.classList.remove("open"); moreBtn.setAttribute("aria-expanded","false"); }
moreBtn.addEventListener("click", () => more.classList.contains("open") ? closeMore() : openMore());
more.addEventListener("click", e => {
  const b = e.target.closest("[data-more]"); if (!b) return;
  if (b.dataset.more === "speak") { prefs.speak = !prefs.speak; savePrefs(); buildMore(); more.querySelector('[data-more="speak"]').focus(); }
});
/* destructive: press and hold, then undo is still offered */
let holdT;
function startHold(b) { b.classList.add("holding"); $("#resetLabel").textContent = "继续按住…"; holdT = setTimeout(() => { doReset(); }, 1200); }
function stopHold(b) { clearTimeout(holdT); if (b) { b.classList.remove("holding"); const l = $("#resetLabel"); if (l) l.textContent = "按住以重置"; } }
more.addEventListener("pointerdown", e => { const b = e.target.closest('[data-more="reset"]'); if (b) { e.preventDefault(); startHold(b); } });
more.addEventListener("pointerup", e => stopHold(e.target.closest('[data-more="reset"]') || more.querySelector('[data-more="reset"]')));
more.addEventListener("pointerleave", () => stopHold(more.querySelector('[data-more="reset"]')));
more.addEventListener("keydown", e => { const b = e.target.closest('[data-more="reset"]'); if (b && (e.key === "Enter" || e.key === " ") && !e.repeat) { e.preventDefault(); startHold(b); } });
more.addEventListener("keyup", e => { const b = e.target.closest('[data-more="reset"]'); if (b && (e.key === "Enter" || e.key === " ")) stopHold(b); });
function doReset() {
  const snap = JSON.stringify(progress[show.id] || {});
  const id = show.id;
  const prevSession = session;
  progress[id] = {}; saveProgress(); closeMore();
  history = history.filter(h => h.show !== id);
  session = null; buildSession(); render();
  toast(`已重置 ${show.title}`, () => { progress[id] = JSON.parse(snap); saveProgress(); if (show.id === id) session = prevSession; else sessions[id] = prevSession; hideToast(); render(); });
}

/* ---------- clicks ---------- */
document.addEventListener("click", e => {
  if (!root.contains(e.target) && !sub.contains(e.target) && !trigger.contains(e.target)) closeRoot();
  if (!more.contains(e.target) && !moreBtn.contains(e.target)) closeMore();
  const sayRow = e.target.closest("[data-say]");
  if (sayRow) { e.stopPropagation(); speak(show.words[+sayRow.dataset.say][0], show.lang); return; }
  const act = e.target.closest("[data-act]");
  if (act) {
    const a = act.dataset.act;
    if (a === "say") { speak(show.words[current().i][0], show.lang); return; }
    if (a === "hint") return hint();
    if (a === "back") return removeLast();
    if (a === "next") return finishSpell(false);
    if (a === "reveal" || a === "card") { if (getSelection().toString()) return; reveal(); return; }
    if (a === "known") return grade(true);
    if (a === "forgot") return grade(false);
    if (a === "more") { buildSession(); render(); return; }
  }
  const f = e.target.closest("[data-filter]"); if (f) { listFilter = f.dataset.filter; openRow = null; renderList(); return; }
  const r = e.target.closest("[data-row]"); if (r) { const i = +r.dataset.row; openRow = openRow === i ? null : i; renderList(); const nb = document.querySelector(`[data-row="${i}"]`); nb && nb.focus({preventScroll:true}); }
});
$("#listBtn").addEventListener("click", () => setView(view === "list" ? "study" : "list"));

/* ---------- keyboard: letters always mean spelling, never shortcuts ---------- */
document.addEventListener("keydown", e => {
  if (menuKeys(e)) { e.preventDefault(); return; }
  if (e.target.closest && e.target.closest("input,textarea,[contenteditable]")) return;
  const k = e.key, mod = e.metaKey || e.ctrlKey;
  if (mod && (k === "z" || k === "Z")) { if (history.length) { e.preventDefault(); undo(); } return; }
  if (mod || e.altKey) return;
  if (k === "Escape" && view === "list") { setView("study"); return; }
  if (view !== "study") return;
  const c = current();
  if (c == null) { if (k === "Enter") { const b = document.querySelector('[data-act="more"]'); b && b.click(); } return; }
  if (c.k === "spell" && spell) {
    if (spell.state === "failed") { if (k === "Enter" || k === " ") { e.preventDefault(); finishSpell(false); } return; }
    if (spell.state === "done") { if (k === "Enter") { e.preventDefault(); finishSpell(true); } return; }
    if (k === "Backspace") { e.preventDefault(); removeLast(); return; }
    if (k === "/" || k === "?") { e.preventDefault(); hint(); return; }
    let ch = k.length === 1 && /[a-z]/i.test(k) ? k.toLowerCase() : null;
    if (!ch && (k === "Process" || k === "Unidentified")) { const m = /^Key([A-Z])$/.exec(e.code || ""); if (m) ch = m[1].toLowerCase(); }
    if (ch) { e.preventDefault(); typeKey(ch); }
    else if (k === " ") e.preventDefault();
    return;
  }
  const onButton = document.activeElement && document.activeElement.tagName === "BUTTON" && !document.activeElement.closest(".card");
  if (k === " " && !onButton) { e.preventDefault(); reveal(); }
  else if (k === "Enter" && !onButton) { e.preventDefault(); reveal(); }
  else if (k === "ArrowRight" || k === "2") { e.preventDefault(); grade(true); }
  else if (k === "ArrowLeft" || k === "1") { e.preventDefault(); grade(false); }
});
let resizeT;
addEventListener("resize", () => { closeRoot(); closeMore(); clearTimeout(resizeT); resizeT = setTimeout(() => { const c = session && current(); if (view === "study" && c && c.k === "spell" && spell && spell.state === "typing" && !drag) renderSpell(c.i); }, 150); });
addEventListener("scroll", () => { closeRoot(); closeMore(); }, {passive:true});

/* ---------- boot ---------- */
hydrateIcons();
if (/Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent)) $("#undoKey").textContent = "⌘Z";
buildSession();
render();
</script>
</body>
</html>
